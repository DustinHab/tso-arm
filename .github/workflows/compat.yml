name: Compat

# Programs of an x86-64 Linux distribution under tso-arm: an x86-64 runner packs them with their libraries
# (tools/compat_rootfs.sh), an Arm runner runs them with x86 order kept, with FEX's full TSO and without ordering and
# compares their outputs (tests/compat.sh), message passing between Node worker threads and between Java threads
# included. Then the root file system `tso-arm rootfs` fetches, and everyday commands of it against FEX's full
# ordering (tests/rootfs_check.sh).
on:
  push:
  workflow_dispatch:

jobs:
  rootfs:
    name: Programs from x86-64 Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nodejs ffmpeg p7zip-full zstd default-jdk-headless
      - name: Root file system
        run: sh tools/compat_rootfs.sh compat-rootfs.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: compat-rootfs-${{ github.sha }}
          retention-days: 3
          path: compat-rootfs.tar.zst

  run:
    name: Run on an Arm runner
    needs: rootfs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build clang lld python3 binutils zstd squashfs-tools golang-go \
            xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
          # FEX's thunks, as the release builds them
          g=$(gcc -dumpversion | cut -d. -f1)
          sudo apt-get install -y -q libclang-dev llvm-dev clang-tools libssl-dev pkg-config \
            libstdc++-$g-dev-amd64-cross libgcc-$g-dev-amd64-cross libstdc++-$g-dev-i386-cross libgcc-$g-dev-i386-cross \
            libgl-dev libegl-dev libx11-dev libxrandr-dev libxrender-dev libxcb1-dev libwayland-dev libdrm-dev \
            libasound2-dev
      - name: FEX with the tso-arm patches and its thunks (cached)
        id: fex
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/tso-arm
          key: fex-thunks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fex/patches/*.patch', 'fex/install.sh') }}
      - name: Build FEX
        if: steps.fex.outputs.cache-hit != 'true'
        run: TSO_ARM_THUNKS=1 bin/tso-arm install --generic
      - uses: actions/download-artifact@v4
        with:
          name: compat-rootfs-${{ github.sha }}
      - name: Programs under tso-arm
        run: |
          COMPAT_STATS=1 sh tests/compat.sh compat-rootfs.tar.zst
          cat build/compat/compat.md >>"$GITHUB_STEP_SUMMARY"
          { echo; echo '```'; cat build/compat/stats.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      # what a user gets from `tso-arm rootfs` (FEX's Ubuntu 24.04), and everyday commands of it: shells with pipes,
      # forks and traps, coreutils, compression, perl, Python with fork and signals
      - name: Root file system as a user fetches it
        run: bin/tso-arm rootfs
      - name: Everyday programs against FEX's full ordering
        run: |
          s=0
          sh tests/rootfs_check.sh >rootfs_check.txt 2>&1 || s=$?
          cat rootfs_check.txt
          { echo; echo '```'; cat rootfs_check.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit $s
      # programs with a window: OpenGL and Vulkan of the root file system on an X server without a screen (Xvfb), with
      # the x86 Mesa of the root file system and with --gpu through the host's (both draw with the CPU here)
      - name: Graphics on an X server, with and without --gpu
        run: |
          s=0
          xvfb-run -a -s '-screen 0 1280x720x24' sh tests/graphics_check.sh >graphics.txt 2>&1 || s=$?
          cat graphics.txt
          { echo; echo '```'; cat graphics.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit $s
      # rare failures: multi-threaded programs of it, 5 runs each in three settings, outputs against full ordering
      - name: Multi-threaded programs, many runs
        run: |
          s=0
          sh tests/soak.sh 5 >soak.txt 2>&1 || s=$?
          cat soak.txt
          { echo; echo '```'; cat soak.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit $s
