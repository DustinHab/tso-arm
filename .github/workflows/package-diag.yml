name: Package diagnosis

# By hand: a release run's packages, against the release before and against FEX without the tso-arm patches, on a
# runner of choice, with 32-bit and 64-bit test programs, and how they end (FEX's own messages included).
on:
  # a push to diag/package runs it with the defaults (workflow_dispatch failed on GitHub's side for it at times)
  push:
    branches: ['diag/package']
  workflow_dispatch:
    inputs:
      release_run:
        description: the release workflow's run whose packages to take
      runner:
        description: the runner
        default: ubuntu-22.04-arm
      before:
        description: the release to compare with
        default: v0.4.4
      upstream:
        description: 'yes: FEX without the patches as well (built here, at the commit the patches apply to)'
        default: 'yes'

jobs:
  diag:
    name: Packages of run ${{ github.event.inputs.release_run || '45649681247' }} on ${{ github.event.inputs.runner || 'ubuntu-22.04-arm' }}
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-22.04-arm' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-i686-linux-gnu libc6-dev-i386-cross gcc-x86-64-linux-gnu libc6-dev-amd64-cross gdb \
            cmake ninja-build clang lld python3
      - name: The release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p new old
          gh run download ${{ github.event.inputs.release_run || '45649681247' }} -D dist
          tar -xzf dist/*/tso-arm-[0-9]*-linux-arm64.tar.gz -C new
          gh release download ${{ github.event.inputs.before || 'v0.4.4' }} -p 'tso-arm-[0-9]*-linux-arm64.tar.gz' -D oldpkg
          tar -xzf oldpkg/*.tar.gz -C old
      - name: FEX without the patches
        if: github.event.inputs.upstream != 'no'
        run: |
          base=$(sed -n 's/^BASE=\([0-9a-f]*\).*/\1/p' fex/install.sh)
          git clone -q https://github.com/FEX-Emu/FEX.git up && cd up && git checkout -q $base && git submodule update -q --init --recursive
          mkdir Build && cd Build
          CC=clang CXX=clang++ cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Release -DUSE_LINKER=lld -DENABLE_LTO=False \
            -DBUILD_TESTING=False -DENABLE_ASSERTIONS=False -DBUILD_FEXCONFIG=False -DBUILD_THUNKS=False \
            -DTUNE_CPU=none -DTUNE_ARCH=armv8-a >/dev/null
          ninja FEX FEXServer >/dev/null && ls -la Bin/FEX
      - name: The programs
        run: |
          mkdir -p build
          printf 'int main(void) { return 42; }\n' >ret.c
          i686-linux-gnu-gcc -O2 -static -o build/ret32 ret.c
          x86_64-linux-gnu-gcc -O2 -static -o build/ret64 ret.c
          i686-linux-gnu-gcc -O2 -msse2 -static -pthread -o build/mp32 litmus/mp32.c
          i686-linux-gnu-gcc -O2 -static -pthread -o build/threads32 tests/threads.c
      - name: Each FEX, each program
        run: |
          set +e
          uname -a; getconf GNU_LIBC_VERSION; grep -m1 'Features' /proc/cpuinfo
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p >/dev/null
          for p in new old up; do
            case $p in
            up) F=$PWD/up/Build/Bin/FEX; [ -x "$F" ] || continue; echo "== FEX without the patches" ;;
            *) F=$(ls -d $p/tso-arm-*)/fex/prebuilt/bin/FEX; echo "== $($(ls -d $p/tso-arm-*)/bin/tso-arm version | head -n 2 | tr '\n' ' ')" ;;
            esac
            for q in ret64 ret32 threads32:2 threads32:8 mp32:mp:20000 mp32:vec:20000; do
              FEX_TSOENABLED=1 FEX_OUTPUTLOG=stderr $F build/$(echo $q | tr ':' ' ') >out.txt 2>&1; st=$?
              echo "$q: exit $st: $(tail -n 3 out.txt | tr '\n' ' ' | cut -c1-220)"
            done
          done
          c=$(ls /tmp/core.* 2>/dev/null | head -n 1)
          if [ -n "$c" ]; then
            echo "== $c"
            gdb -q -batch -ex 'bt 12' -ex 'info registers pc sp x0 x1' -ex 'x/6i $pc-12' $(ls -d new/tso-arm-*)/fex/prebuilt/bin/FEX "$c" 2>&1 | tail -n 30
          fi
