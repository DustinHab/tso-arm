name: Wine

# Windows programs the way a user runs them: an x86-64 runner builds the Windows test programs of tests/win with MinGW,
# an Arm runner fetches the root file system with `tso-arm rootfs` and WineHQ's Wine with `tso-arm wine`, makes a
# Wine prefix and runs them with x86 order kept, under FEX's full TSO and without ordering (tests/winehq_check.sh).
on:
  push:
  workflow_dispatch:

jobs:
  programs:
    name: Windows test programs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: MinGW
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-mingw-w64-x86-64
      - name: Build
        run: |
          mkdir -p win
          for c in tests/win/*.c; do x86_64-w64-mingw32-gcc -O2 -o win/$(basename $c .c).exe $c; done
      - uses: actions/upload-artifact@v4
        with:
          name: win-programs-${{ github.sha }}
          retention-days: 3
          path: win/

  run:
    name: Wine on an Arm runner
    needs: programs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build clang lld python3 zstd squashfs-tools
      - name: FEX with the tso-arm patches (cached)
        id: fex
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/tso-arm
          key: fex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fex/patches/*.patch', 'fex/install.sh') }}
      - name: Build FEX
        if: steps.fex.outputs.cache-hit != 'true'
        run: bin/tso-arm install --generic
      - uses: actions/download-artifact@v4
        with:
          name: win-programs-${{ github.sha }}
          path: win
      - name: Root file system as a user fetches it
        run: bin/tso-arm rootfs >/dev/null
      - name: Windows programs through tso-arm wine (WineHQ's Wine)
        timeout-minutes: 45
        run: |
          s=0
          sh tests/winehq_check.sh win/spsc.exe >winehq.txt 2>&1 || s=$?
          cat winehq.txt
          { echo; echo '```'; cat winehq.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit $s
