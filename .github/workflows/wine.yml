name: Wine

# Windows programs through Wine under tso-arm: an x86-64 runner packs Ubuntu 24.04's wine64 with its libraries and the
# Windows test programs of tests/win (tools/wine_rootfs.sh), an Arm runner makes a Wine prefix and runs them with x86
# order kept, under FEX's full TSO and without ordering (tests/wine_check.sh).
on:
  push:
  workflow_dispatch:

jobs:
  rootfs:
    name: Wine from x86-64 Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends wine64 gcc-mingw-w64-x86-64 zstd
      - name: Root file system with Wine and the test programs
        run: sh tools/wine_rootfs.sh wine-rootfs.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: wine-rootfs-${{ github.sha }}
          retention-days: 3
          path: wine-rootfs.tar.zst

  run:
    name: Wine on an Arm runner
    needs: rootfs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build clang lld python3 zstd
      - name: FEX with the tso-arm patches (cached)
        id: fex
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/tso-arm
          key: fex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fex/patches/*.patch', 'fex/install.sh') }}
      - name: Build FEX
        if: steps.fex.outputs.cache-hit != 'true'
        run: bin/tso-arm install --generic
      - uses: actions/download-artifact@v4
        with:
          name: wine-rootfs-${{ github.sha }}
      - name: Windows programs under tso-arm
        run: |
          s=0
          sh tests/wine_check.sh wine-rootfs.tar.zst >wine.txt 2>&1 || s=$?
          cat wine.txt
          { echo; echo '```'; cat wine.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit $s
