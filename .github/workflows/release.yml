name: Release

# A tag v* builds FEX with the tso-arm patches for any Armv8.0 core on Ubuntu 22.04 (glibc 2.35, so the build runs
# on Ubuntu 22.04 and newer, Debian 12 and newer, Raspberry Pi OS), checks the packages on both Arm runners and
# makes a draft release of them. Run by hand, it builds and checks the packages only.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Prebuilt FEX
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build clang lld python3 git
          # FEX's thunks: libclang for their generator, the x86 C++ libraries for their guest side, the host's headers
          g=$(gcc -dumpversion | cut -d. -f1)
          sudo apt-get install -y -q libclang-dev llvm-dev clang-tools libssl-dev pkg-config \
            libstdc++-$g-dev-amd64-cross libgcc-$g-dev-amd64-cross libstdc++-$g-dev-i386-cross libgcc-$g-dev-i386-cross \
            libgl-dev libegl-dev libx11-dev libxrandr-dev libxrender-dev libxcb1-dev libwayland-dev libdrm-dev \
            libasound2-dev

      - name: Build FEX with the tso-arm patches and its thunks, for any Armv8.0 core
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/tso-arm
          TSO_ARM_PREFIX=/opt/tso-arm TSO_ARM_THUNKS=1 sh fex/install.sh --generic
          ls /opt/tso-arm/lib/fex-emu/HostThunks /opt/tso-arm/share/fex-emu/GuestThunks

      - name: Packages for the release
        run: sh tools/package.sh /opt/tso-arm dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/
          retention-days: 30

  check:
    name: Check on ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04-arm, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld python3 python3-pip binutils gcc-x86-64-linux-gnu libc6-dev-amd64-cross
          # 32-bit test programs where the cross C library is 2.39 (Ubuntu 24.04): a statically linked i386 program
          # of glibc 2.35 (Ubuntu 22.04's) crashes in its start-up code under FEX, without the patches as well
          # (docs/ROADMAP.md, item 13); one without a C library runs there
          if [ "${{ matrix.runner }}" = ubuntu-24.04-arm ]; then
            sudo apt-get install -y -q gcc-i686-linux-gnu libc6-dev-i386-cross
          fi
          python3 -m pip install --user 'capstone>=5,<6' ||
            python3 -m pip install --user --break-system-packages 'capstone>=5,<6'
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Install from the release package, as a user would
        run: |
          cd dist && sha256sum -c SHA256SUMS && cd ..
          tar -xzf dist/tso-arm-[0-9]*-linux-arm64.tar.gz
          tso-arm-[0-9]*/bin/tso-arm install
          tso-arm version
          tso-arm check

      - name: Correctness tests
        run: cd tso-arm-[0-9]*/ && sh tests/ci.sh

      - name: x86-64 containers through the package's statically linked FEX
        run: |
          cd tso-arm-[0-9]*/
          sudo bin/tso-arm binfmt register
          grep -q '^flags: PF' /proc/sys/fs/binfmt_misc/tso-arm
          sh tests/container_check.sh
          sudo bin/tso-arm binfmt unregister

      - name: The FEX package alone, as 'tso-arm install' fetches it
        run: |
          rm -rf ~/.local/opt/tso-arm
          TSO_ARM_PACKAGE=$(ls dist/tso-arm-fex-*.tar.gz) tso-arm install
          tso-arm version
          tso-arm uninstall
          test ! -e ~/.local/opt/tso-arm

  release:
    name: Draft release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist

      - name: Draft release with the changelog's section of this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          sh tools/release_notes.sh "$v" >notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "tso-arm $v" --notes-file notes.md
