name: Release diagnosis

# By hand: a release run's packages, against the release before, on a runner of choice, with a program of tso-arm's
# tests run several times in each, and how it ends.
on:
  workflow_dispatch:
    inputs:
      run:
        description: the release workflow's run whose packages to take
        required: true
      runner:
        description: the runner
        default: ubuntu-22.04-arm
      before:
        description: the release to compare with
        default: v0.4.4
      program:
        description: 'what to run: mp32 (litmus/mp32.c) or threads32 (tests/threads.c), and its arguments'
        default: mp32 mp 200000

jobs:
  diag:
    name: Packages of run ${{ github.event.inputs.run }} on ${{ github.event.inputs.runner }}
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-i686-linux-gnu libc6-dev-i386-cross gcc-x86-64-linux-gnu libc6-dev-amd64-cross gdb
      - name: The release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p new old
          gh run download ${{ github.event.inputs.run }} -D dist
          tar -xzf dist/*/tso-arm-[0-9]*-linux-arm64.tar.gz -C new
          gh release download ${{ github.event.inputs.before }} -p 'tso-arm-[0-9]*-linux-arm64.tar.gz' -D oldpkg
          tar -xzf oldpkg/*.tar.gz -C old
          ls new old
      - name: The program
        run: |
          mkdir -p build
          i686-linux-gnu-gcc -O2 -msse2 -static -pthread -o build/mp32 litmus/mp32.c
          i686-linux-gnu-gcc -O2 -static -pthread -o build/threads32 tests/threads.c
          file build/mp32
      - name: Each package, ten runs
        run: |
          set +e
          uname -a; getconf GNU_LIBC_VERSION; grep -m1 'Features' /proc/cpuinfo
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p >/dev/null
          set -- ${{ github.event.inputs.program }}
          prog=build/$1; shift
          for p in new old; do
            T=$(ls -d $p/tso-arm-*)/bin/tso-arm
            echo "== $($T version | head -n 2 | tr '\n' ' ')"
            for i in $(seq 10); do
              out=$($T run $prog "$@" 2>&1 | tail -n 2 | tr '\n' ' '); echo "run $i: exit $? $out"
            done
            F=$(ls -d $p/tso-arm-*)/fex/prebuilt/bin/FEX
            for i in 1 2 3; do
              out=$(FEX_TSOENABLED=1 $F $prog "$@" 2>&1 | tail -n 2 | tr '\n' ' '); echo "FEX directly, full TSO, run $i: $out"
            done
          done
          ls -la /tmp/core.* 2>/dev/null | head
          c=$(ls /tmp/core.* 2>/dev/null | head -n 1)
          if [ -n "$c" ]; then
            F=$(ls -d new/tso-arm-*)/fex/prebuilt/bin/FEX
            gdb -q -batch -ex 'bt 12' -ex 'info registers pc sp' -ex 'x/6i $pc-12' $F "$c" 2>&1 | tail -n 30
          fi
