name: Steam

# Valve's Steam client for Linux under tso-arm on an Arm runner, as far as it gets without logging in
# (tests/steam_check.sh): Valve's launcher package unpacked, started with 'tso-arm run' on Xvfb, the bootstrap, the
# client's update, steamwebhelper and its windows recorded with screenshots and Steam's logs. Steam requires user
# namespaces (its requirements check runs bubblewrap, and steamwebhelper's sandbox makes them), which Ubuntu 24.04's
# AppArmor restricts: variants with the restriction lifted (sysctl) or an AppArmor profile that allows them to FEX
# alone, with the failed system calls traced, with binfmt_misc entries under FEX's own names, and with FEX's server
# socket in /tmp instead of XDG_RUNTIME_DIR.

on:
  push:
    # as CI: not for what changes only words or the diagnosis workflows run by hand
    paths-ignore: ['docs/**', '**.md', '.github/workflows/*-diag.yml', '.github/workflows/profile.yml', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

jobs:
  steam:
    name: Steam (${{ matrix.name }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: userns-strace
            userns: 1
            strace: 1
          - name: userns-socket-in-home
            userns: 1
            steam_env: FEX_SERVERSOCKETPATH=/home/runner/.fex-server.socket
          - name: userns-socket-in-home-strace
            userns: 1
            strace: 1
            steam_env: FEX_SERVERSOCKETPATH=/home/runner/.fex-server.socket
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb x11-utils imagemagick dbus-x11 squashfs-tools zstd strace \
            cmake ninja-build clang lld python3
          # FEX's thunks, where FEX has to be built (as the release builds them)
          g=$(gcc -dumpversion | cut -d. -f1)
          sudo apt-get install -y -q libclang-dev llvm-dev clang-tools libssl-dev pkg-config \
            libstdc++-$g-dev-amd64-cross libgcc-$g-dev-amd64-cross libstdc++-$g-dev-i386-cross libgcc-$g-dev-i386-cross \
            libgl-dev libegl-dev libx11-dev libxrandr-dev libxrender-dev libxcb1-dev libwayland-dev libdrm-dev \
            libasound2-dev

      - name: FEX with the tso-arm patches and its thunks (cached)
        id: fex
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/tso-arm
          key: fex-thunks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fex/patches/*.patch', 'fex/install.sh') }}

      - name: FEX (the newest release's prebuilt one where its patches are these, else built)
        if: steps.fex.outputs.cache-hit != 'true'
        run: TSO_ARM_THUNKS=1 bin/tso-arm install

      - name: Machine
        run: bin/tso-arm version && bin/tso-arm check

      - name: Root file system as a user fetches it
        run: bin/tso-arm rootfs >/dev/null

      - name: User namespaces allowed for every program (sysctl)
        if: matrix.userns
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: User namespaces allowed for FEX alone (AppArmor profile)
        if: matrix.apparmor
        run: |
          sudo tee /etc/apparmor.d/tso-arm-fex >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile tso-arm-fex $HOME/.local/opt/tso-arm/bin/{FEX,FEX-static} flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/tso-arm-fex
          sudo aa-status 2>/dev/null | grep -A1 -i 'tso-arm' || true

      # FEX passes an x86 program a program executes to the kernel only where binfmt_misc has entries of its own names
      # (FEX-x86_64, FEX-x86); otherwise it starts itself again through /proc/self/exe
      - name: binfmt_misc under FEX's own names, to the FEX tso-arm runs
        if: matrix.fexbinfmt
        run: |
          F=$HOME/.local/opt/tso-arm/bin/FEX
          mask='\xff\xff\xff\xff\xff\xfe\xfe\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff'
          echo ":FEX-x86_64:M:0:\\x7fELF\\x02\\x01\\x01\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x02\\x00\\x3e\\x00:$mask:$F:POCF" |
            sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          echo ":FEX-x86:M:0:\\x7fELF\\x01\\x01\\x01\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x02\\x00\\x03\\x00:$mask:$F:POCF" |
            sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          head -n 3 /proc/sys/fs/binfmt_misc/FEX-x86_64 /proc/sys/fs/binfmt_misc/FEX-x86

      - name: Steam
        timeout-minutes: 40
        env:
          STEAM_STRACE: ${{ matrix.strace }}
          STEAM_ARGS: ${{ matrix.steam_args }}
          STEAM_ENV: ${{ matrix.steam_env }}
        run: |
          STEAM_MINUTES=25 sh tests/steam_check.sh ${{ matrix.name }} ${{ matrix.args }}
          cat build/steam/${{ matrix.name }}/summary.md >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: steam-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          path: build/steam/${{ matrix.name }}/
