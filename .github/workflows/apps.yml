name: Apps

# x86 desktop programs without an Arm build for Linux, as a user gets them through 'tso-arm app' (from their makers'
# own addresses: Discord, Spotify, Slack, Signal, Zoom, Microsoft Edge), each up to its first window on Xvfb on an Arm
# runner (tests/apps_check.sh), with screenshots and their output as an artifact. Weekly (the programs update
# themselves), by hand, and where tso-arm app or the check changes.

on:
  push:
    paths: ['tools/app.sh', 'tests/apps_check.sh', '.github/workflows/apps.yml']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      apps:
        description: 'Programs (empty: all)'
        default: ''
      env:
        description: 'NAME=VALUE ... for each program'
        default: ''
      args:
        description: 'Options given to each program'
        default: ''
      symbols:
        description: 'FEX built here, with its symbol table (gdb names its functions; some 25 minutes more)'
        type: boolean
        default: false

jobs:
  apps:
    name: Desktop programs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb x11-utils imagemagick dbus-x11 squashfs-tools zstd gpgv gdb \
            cmake ninja-build clang lld python3 gcc-x86-64-linux-gnu libc6-dev-amd64-cross
          g=$(gcc -dumpversion | cut -d. -f1)
          sudo apt-get install -y -q libclang-dev llvm-dev clang-tools libssl-dev pkg-config \
            libstdc++-$g-dev-amd64-cross libgcc-$g-dev-amd64-cross libstdc++-$g-dev-i386-cross libgcc-$g-dev-i386-cross \
            libgl-dev libegl-dev libx11-dev libxrandr-dev libxrender-dev libxcb1-dev libwayland-dev libdrm-dev \
            libasound2-dev

      - name: FEX with the tso-arm patches and its thunks (cached)
        id: fex
        if: ${{ !inputs.symbols }}
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/tso-arm
          key: fex-thunks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fex/patches/*.patch', 'fex/install.sh') }}

      - name: FEX (the newest release's prebuilt one where its patches are these, else built)
        if: ${{ !inputs.symbols && steps.fex.outputs.cache-hit != 'true' }}
        run: TSO_ARM_THUNKS=1 bin/tso-arm install

      - name: FEX with its symbol table (cached)
        id: fexsym
        if: ${{ inputs.symbols }}
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/tso-arm
          key: fex-symbols-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fex/patches/*.patch', 'fex/install.sh') }}

      # the same code linked once more without --strip-all (fex/link_symbols.sh), in place of the installed one
      - name: FEX built here, with its symbol table
        if: ${{ inputs.symbols && steps.fexsym.outputs.cache-hit != 'true' }}
        run: |
          bin/tso-arm install --source
          cd ~/.local/src/tso-arm/FEX/Build-tso-arm
          cmd=$(ninja -t commands Bin/FEX | tail -n 1)
          cmd=$(echo "$cmd" | sed 's/-Xlinker --strip-all//g; s/-Wl,--strip-all//g; s/,--strip-all//g; s# -o Bin/FEX # -o Bin/FEX-sym #')
          sh -c "$cmd"
          cp Bin/FEX-sym ~/.local/opt/tso-arm/bin/FEX
          file ~/.local/opt/tso-arm/bin/FEX

      - name: Root file system as a user fetches it
        run: bin/tso-arm version && bin/tso-arm rootfs >/dev/null

      # Chromium's and Electron's own sandbox, which 'tso-arm app run' uses where user namespaces are allowed: Ubuntu's
      # AppArmor restricts them, so they are allowed to tso-arm's FEX, as a user does it
      - name: User namespaces for tso-arm's FEX (sudo tso-arm userns allow)
        run: sudo bin/tso-arm userns allow && bin/tso-arm userns

      # each program up to its first window, then all removed again (the root file system as before)
      - name: Programs up to their first window
        timeout-minutes: 70
        env:
          APPS_ENV: ${{ inputs.env }}
          APPS_ARGS: ${{ inputs.args }}
          APPS: ${{ inputs.apps }}
          # by hand for some programs: what a program that draws nothing waits in (tests/waits.py, gdb)
          APPS_TRACE: ${{ inputs.apps != '' && '1' || '0' }}
        run: |
          s=0
          # shellcheck disable=SC2086 # a list
          APPS_EXPECT=window APPS_REMOVE=1 APPS_MINUTES=6 sh tests/apps_check.sh $APPS || s=$?
          cat build/apps/summary.md >>"$GITHUB_STEP_SUMMARY"
          exit $s

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apps-${{ github.sha }}
          retention-days: 14
          path: build/apps/
