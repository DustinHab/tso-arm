name: Wine diagnosis

# By hand: the steps of tests/winehq_check.sh one at a time, each with its own time limit, with the kernel's messages
# and the machine's memory written into the log as they come (a Wine run hung the machine it ran on).
on:
  workflow_dispatch:
    inputs:
      modes:
        description: 'runs, in this order: a mode, or MODE:VAR=VALUE,VAR=VALUE for one with settings of its own'
        default: full tso
      messages:
        description: messages of the ring buffer
        default: '2000000'

jobs:
  diag:
    name: Wine, step by step
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build clang lld python3 zstd squashfs-tools gcc-mingw-w64-x86-64
      - name: FEX with the tso-arm patches (cached)
        id: fex
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/tso-arm
          key: fex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fex/patches/*.patch', 'fex/install.sh') }}
      - name: Build FEX
        if: steps.fex.outputs.cache-hit != 'true'
        run: bin/tso-arm install --generic
      - name: Windows program
        run: x86_64-w64-mingw32-gcc -O2 -o spsc.exe tests/win/spsc.c
      - name: Root file system
        timeout-minutes: 15
        run: bin/tso-arm rootfs 2>&1 | tail -n 5; ls ~/.local/share/fex-emu/RootFS/
      - name: Wine
        timeout-minutes: 10
        run: bin/tso-arm wine install
      - name: Prefix and program, with the kernel's messages and memory alongside
        timeout-minutes: 30
        run: |
          set +e
          sudo dmesg -n 7
          sudo dmesg -w --time-format iso | sed 's/^/kernel: /' &
          export WINEPREFIX=$HOME/.wine-diag WINEDEBUG=err+all
          w=$(bin/tso-arm wine | sed -n 's/^Wine .* in \(.*\)$/\1/p')/opt/wine-stable/bin/wineserver
          mine() { ps -u "$(id -u)" -o pid=,stat=,etime=,wchan:24=,rss=,comm= | grep -v -E ' (ps|grep|sed|bash|sh|sleep|sudo|dmesg|Runner|node|systemd|sd-pam|dbus|awk|head|cut|sort|uniq|wc|tail)$'; }
          before=$(ps -u "$(id -u)" -o pid= | tr -d ' ' | sort -n)
          killnew() { for p in $(ps -u "$(id -u)" -o pid= | tr -d ' ' | sort -n); do echo "$before" | grep -qx "$p" || kill -9 "$p" 2>/dev/null; done; sleep 2; }
          echo "== wineboot, full ordering"
          TSO_ARM_MODE=full timeout -k 10 600 bin/tso-arm wine wineboot --init >wb.log 2>&1; echo "status $?"; tail -n 3 wb.log
          TSO_ARM_MODE=full timeout -k 10 60 bin/tso-arm run $w -w; echo "server ended: $?"
          killnew
          n=0
          for r in ${{ github.event.inputs.modes }}; do
            n=$((n + 1))
            m=${r%%:*}
            vars=""
            case $r in *:*) vars=$(echo "${r#*:}" | tr ',' ' ') ;; esac
            echo "== spsc.exe, $m ${vars:-}"
            s=$(date +%s)
            env $vars TSO_ARM_MODE=$m TSO_VIEWS_LOG=$PWD/views-$n.log bin/tso-arm wine ./spsc.exe ${{ github.event.inputs.messages }} >spsc-$n.log 2>&1 </dev/null &
            p=$!
            for i in $(seq 120); do kill -0 $p 2>/dev/null || break; sleep 1; done
            echo "program: $(kill -0 $p 2>/dev/null && echo 'still running' || echo ended) after $(( $(date +%s) - s )) s: $(grep '^spsc' spsc-$n.log)"
            for t in 10 30 60; do
              sleep $(( t == 10 ? 10 : 20 + (t == 60 ? 10 : 0) ))
              echo "after +$t s: $(mine | wc -l) processes, explorer.exe $(mine | grep -c explorer), $(free -m | awk '/^Mem/ { print $3 " MB used" }')"
            done
            mine | sort -k6 | awk '{ print $2, $4, $6 }' | sort | uniq -c | sort -rn | head -n 12
            for q in $(mine | awk '$6 == "explorer.exe" { print $1 }' | head -n 2); do
              pp=$(awk '{print $4}' /proc/$q/stat)
              echo "-- explorer.exe $q, parent $pp ($(tr '\0' ' ' </proc/$pp/cmdline 2>/dev/null | cut -c1-80)), syscall $(sudo cat /proc/$q/syscall), cpu $(awk '{print $14 + $15}' /proc/$q/stat) ticks, threads:"
              echo "   its command line: $(tr '\0' ' ' </proc/$q/cmdline | cut -c1-160)"
              # the futex word it waits on (the system call's first argument): the mapping it lies in, and its value
              a=$(sudo cat /proc/$q/syscall | awk '$1 == 98 { print $2 }')
              if [ -n "$a" ]; then
                sudo cat /proc/$q/maps | while read -r range rest; do [ $((a)) -ge $((0x${range%-*})) ] && [ $((a)) -lt $((0x${range#*-})) ] && echo "   in: $range $rest"; done
                echo "   value: $(sudo dd if=/proc/$q/mem bs=1 count=4 skip=$((a)) iflag=skip_bytes 2>/dev/null | od -An -tx4)"
              fi
              sudo cat /proc/$q/status | grep -E '^(SigBlk|SigPnd|ShdPnd|Threads)'
              for t in /proc/$q/task/*; do
                echo "   $(basename $t) $(awk '{print $3}' $t/stat) $(cat $t/wchan) syscall $(cut -d' ' -f1 $t/syscall 2>/dev/null)"
                sudo cat $t/stack 2>/dev/null | head -n 5 | sed 's/^/      /'
              done
            done
            [ -f views-$n.log ] && { echo "views log: $(grep -c . views-$n.log) lines, $(grep -c 'fork:' views-$n.log) forks"; grep -E 'fork|not ours' views-$n.log | tail -n 8; }
            tail -n 4 spsc-$n.log
            killnew
          done
