name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  arm64:
    name: Correctness on an Arm runner
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build clang lld python3 python3-pip binutils \
            gcc-x86-64-linux-gnu libc6-dev-amd64-cross gcc-i686-linux-gnu libc6-dev-i386-cross
          # Ubuntu 24.04 packages Capstone 4; the translator is written against 5
          python3 -m pip install --user --break-system-packages 'capstone>=5,<6'

      - name: FEX with the tso-arm patches (cached)
        id: fex
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/tso-arm
          key: fex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fex/patches/*.patch', 'fex/install.sh') }}

      - name: Build FEX
        if: steps.fex.outputs.cache-hit != 'true'
        run: bin/tso-arm install --generic

      - name: Machine
        run: bin/tso-arm check

      - name: Correctness tests
        run: sh tests/ci.sh

      - name: Started directly (binfmt_misc), and in x86-64 containers
        run: |
          bin/tso-arm binfmt
          sudo bin/tso-arm binfmt register
          bin/tso-arm binfmt
          grep -q '^flags: PF' /proc/sys/fs/binfmt_misc/tso-arm
          sh tests/container_check.sh
          ./build/ci/threads 8 | tee /tmp/direct.txt
          grep -q 'wrong 0' /tmp/direct.txt
          ./build/ci/threads32 8 | tee /tmp/direct32.txt
          grep -q 'wrong 0' /tmp/direct32.txt
          other=$(bin/tso-arm binfmt | grep -c 'another handler' || true)
          sudo bin/tso-arm binfmt unregister
          bin/tso-arm binfmt
          if [ "$other" = 0 ] && ./build/ci/threads 8 2>/dev/null; then
            echo "an x86-64 program still started directly without the registration"
            exit 1
          fi

      - name: Installed for every user from a release package (tools/get.sh as root), updated, removed
        run: |
          # a release package of this commit with the FEX built above (its source is not cached with it)
          [ -f ~/.local/src/tso-arm/FEX/LICENSE ] && src=~/.local/src/tso-arm/FEX || { src=$(mktemp -d); echo FEX > $src/LICENSE; }
          sh tools/package.sh ~/.local/opt/tso-arm dist "$src"
          v=$(cat VERSION)
          sudo TSO_ARM_TARBALL=$PWD/dist/tso-arm-$v-linux-arm64.tar.gz sh tools/get.sh
          test "$(readlink /opt/tso-arm/current)" = "$v"
          grep -q /opt/tso-arm/current/fex/prebuilt/bin/FEX-static /proc/sys/fs/binfmt_misc/tso-arm
          grep -q /opt/tso-arm/current/fex/prebuilt/bin/FEX-static /proc/sys/fs/binfmt_misc/tso-arm-i386
          tso-arm version
          ./build/ci/threads 8 | grep 'wrong 0'
          ./build/ci/threads32 8 | grep 'wrong 0'
          docker run --rm --platform linux/amd64 -v $PWD/build/ci:/ci:ro ubuntu:24.04 /ci/threads 8 | grep 'wrong 0'
          # an update to a newer package: the link moves, the version before stays
          t=$(mktemp -d) && tar -xzf dist/tso-arm-$v-linux-arm64.tar.gz -C $t
          mv $t/tso-arm-$v $t/tso-arm-99.0.0 && echo 99.0.0 > $t/tso-arm-99.0.0/VERSION
          tar -czf $t/tso-arm-99.0.0-linux-arm64.tar.gz -C $t tso-arm-99.0.0
          sudo TSO_ARM_TARBALL=$t/tso-arm-99.0.0-linux-arm64.tar.gz tso-arm update
          test "$(readlink /opt/tso-arm/current)" = 99.0.0 && test -d /opt/tso-arm/$v
          ./build/ci/threads32 8 | grep 'wrong 0'
          sudo tso-arm uninstall
          test ! -e /opt/tso-arm && test ! -e /usr/local/bin/tso-arm && test ! -e /proc/sys/fs/binfmt_misc/tso-arm

      - name: Efficiency on this runner (informational)
        continue-on-error: true
        run: |
          sudo apt-get install -y -q linux-tools-common linux-tools-$(uname -r) || sudo apt-get install -y -q linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=1
          sh tests/ci_bench.sh

      - name: Programs and learned libraries, for reproducing elsewhere
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learned-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/ci-x86/
            build/ci-learn-*.log
            ~/.cache/tso-arm/aot/
