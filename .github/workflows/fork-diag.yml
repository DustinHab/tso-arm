name: Fork diagnosis

# By hand: tests/forksnap.c many times under the page protocol on GitHub's Arm runner, with core dumps kept and
# FEX's and the views' messages, to find a crash seen once in the release check.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: runs of forksnap
        default: '40'

jobs:
  diag:
    name: forksnap, many times
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build clang lld python3 gcc-x86-64-linux-gnu libc6-dev-amd64-cross gdb
      - name: FEX with the tso-arm patches (cached)
        id: fex
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/tso-arm
          key: fex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fex/patches/*.patch', 'fex/install.sh') }}
      - name: Build FEX
        if: steps.fex.outputs.cache-hit != 'true'
        run: bin/tso-arm install --generic
      - name: forksnap
        run: |
          set +e
          x86_64-linux-gnu-gcc -O2 -static -pthread -o forksnap tests/forksnap.c
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p >/dev/null
          ok=0
          for i in $(seq ${{ github.event.inputs.runs }}); do
            out=$(TSO_VIEWS_LOG=/tmp/views-$i.log timeout 120 bin/tso-arm run ./forksnap 50 2>/tmp/err-$i.log | tail -n 1); st=$?
            case $out in "forksnap: 50 forks, 0 children"*) ok=$((ok + 1)); rm -f /tmp/views-$i.log ;; *)
              echo "run $i: status $st: $out"; tail -n 5 /tmp/err-$i.log
              grep -E 'not ours|keeps faulting|fork' /tmp/views-$i.log | tail -n 12 ;;
            esac
          done
          echo "forksnap: $ok of ${{ github.event.inputs.runs }} runs right"
          ls -la /tmp/core.* 2>/dev/null | head
